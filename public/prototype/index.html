<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이오파운드리 통합플랫폼 — 프로토타입</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#f5f4ee;
    --surface:#ffffff;
    --surface-2:#ecebe2;
    --ink:#171f1a;
    --muted:#5c665f;
    --border:#dcd8cb;
    --accent:#0d8a78;
    --accent-ink:#ffffff;
    --accent-soft:#d9efea;
    --foundry:#b8630f;
    --foundry-soft:#f3e2cc;
    --good:#2f8f46;
    --good-soft:#dcefe0;
    --warn:#b3820f;
    --warn-soft:#f4ecd4;
    --critical:#c0473d;
    --critical-soft:#f6dfdc;
    --info:#2f66c2;
    --info-soft:#dce7f8;
    --shadow: 0 1px 2px rgba(23,31,26,.04), 0 8px 24px -12px rgba(23,31,26,.18);
    --focus: 0 0 0 3px rgba(13,138,120,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1210;
      --surface:#161c19;
      --surface-2:#1e2521;
      --ink:#eef2ee;
      --muted:#9baaa2;
      --border:#2a322c;
      --accent:#49d6bd;
      --accent-ink:#04211c;
      --accent-soft:#173330;
      --foundry:#e2954a;
      --foundry-soft:#3a2a17;
      --good:#59c47a;
      --good-soft:#173323;
      --warn:#e0b74a;
      --warn-soft:#372c14;
      --critical:#e8817a;
      --critical-soft:#3a1e1c;
      --info:#7ea6ea;
      --info-soft:#182741;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
      --focus: 0 0 0 3px rgba(73,214,189,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1210;
    --surface:#161c19;
    --surface-2:#1e2521;
    --ink:#eef2ee;
    --muted:#9baaa2;
    --border:#2a322c;
    --accent:#49d6bd;
    --accent-ink:#04211c;
    --accent-soft:#173330;
    --foundry:#e2954a;
    --foundry-soft:#3a2a17;
    --good:#59c47a;
    --good-soft:#173323;
    --warn:#e0b74a;
    --warn-soft:#372c14;
    --critical:#e8817a;
    --critical-soft:#3a1e1c;
    --info:#7ea6ea;
    --info-soft:#182741;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    --focus: 0 0 0 3px rgba(73,214,189,.4);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
    font-size:14px; line-height:1.55;
  }
  ::selection{ background:var(--accent-soft); }
  .mono{ font-family:'IBM Plex Mono','SFMono-Regular',monospace; font-variant-numeric:tabular-nums; }
  h1,h2,h3,h4{ text-wrap:balance; margin:0; font-family:'IBM Plex Sans KR',sans-serif; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  :focus-visible{ outline:none; box-shadow:var(--focus); border-radius:6px; }

  /* ---------- shell ---------- */
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:250px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    padding:20px 18px 16px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border);
  }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), var(--foundry));
    display:flex; align-items:center; justify-content:center;
    color:var(--accent-ink); font-weight:700; font-size:14px;
  }
  .brand-text h1{ font-size:14.5px; font-weight:700; letter-spacing:-.01em; }
  .brand-text span{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }

  .nav{ padding:14px 10px; display:flex; flex-direction:column; gap:18px; flex:1; }
  .nav-group-label{
    font-size:10.5px; font-weight:600; color:var(--muted); text-transform:uppercase;
    letter-spacing:.08em; padding:0 10px; margin-bottom:6px; display:block;
  }
  .nav-group{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:8px 10px; border-radius:8px; border:none; background:none; cursor:pointer;
    color:var(--muted); font-size:13px; font-weight:500;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav-item .dot{
    width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex-shrink:0;
  }
  .nav-item.active .dot{ opacity:1; }

  .sidebar-foot{
    padding:14px 18px; border-top:1px solid var(--border);
    font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:4px;
  }

  .main{ flex:1; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 28px; background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .crumb{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .crumb b{ color:var(--ink); font-weight:600; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:999px; border:1px solid var(--border); color:var(--muted);
  }
  .badge.proto{ background:var(--foundry-soft); color:var(--foundry); border-color:transparent; }
  .theme-toggle{
    border:1px solid var(--border); background:var(--surface); color:var(--muted);
    border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px;
  }

  .view{ padding:24px 28px 60px; max-width:1280px; }
  .view-head{ margin-bottom:20px; }
  .view-head h2{ font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .view-head p{ margin:5px 0 0; color:var(--muted); font-size:13px; max-width:64ch; }

  /* ---------- primitives ---------- */
  .grid{ display:grid; gap:14px; }
  .grid-kpi{ grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .grid-2{ grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .grid-cards{ grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px; box-shadow:var(--shadow);
  }
  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .panel-head h3{ font-size:14px; font-weight:700; }
  .panel-head .sub{ font-size:11.5px; color:var(--muted); }

  .kpi{ padding:16px; }
  .kpi .label{ font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .value{ font-size:26px; font-weight:700; margin-top:8px; font-family:'IBM Plex Mono',monospace; }
  .kpi .delta{ font-size:12px; margin-top:6px; display:flex; align-items:center; gap:4px; }
  .kpi .delta.up{ color:var(--good); }
  .kpi .delta.down{ color:var(--critical); }
  .kpi .delta.flat{ color:var(--muted); }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--border);
  }
  tbody td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    font-size:11px; font-weight:600; white-space:nowrap;
  }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.critical{ background:var(--critical-soft); color:var(--critical); }
  .pill.info{ background:var(--info-soft); color:var(--info); }
  .pill.neutral{ background:var(--surface-2); color:var(--muted); }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .bar-track{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; min-width:80px; }
  .bar-fill{ height:100%; border-radius:999px; background:var(--accent); }
  .bar-fill.foundry{ background:var(--foundry); }
  .bar-row{ display:flex; align-items:center; gap:8px; }
  .bar-row .pct{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; width:34px; text-align:right; flex-shrink:0; }

  .id-chip{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:var(--surface-2);
    padding:2px 6px; border-radius:5px; color:var(--ink);
  }

  .kanban{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  .kanban-col{ background:var(--surface-2); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .kanban-col h4{ font-size:11.5px; font-weight:700; padding:2px 4px 4px; display:flex; justify-content:space-between; align-items:center; }
  .kanban-col h4 span{ font-family:'IBM Plex Mono',monospace; color:var(--muted); font-weight:500; }
  .kanban-card{
    background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px;
    font-size:12px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow);
  }
  .kanban-card .k-title{ font-weight:600; }
  .kanban-card .k-meta{ display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }

  .sparkline{ display:block; }
  .device-card{ display:flex; flex-direction:column; gap:10px; }
  .device-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .device-head .name{ font-weight:700; font-size:13.5px; }
  .device-head .type{ font-size:11.5px; color:var(--muted); }
  .device-metrics{ display:flex; gap:14px; }
  .device-metrics div{ font-size:11px; color:var(--muted); }
  .device-metrics b{ display:block; font-size:15px; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }

  .stack{ display:flex; flex-direction:column; gap:10px; }
  .row-between{ display:flex; justify-content:space-between; align-items:center; gap:10px; }

  .avatar{
    width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;
  }
  .feed-item{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .feed-item:last-child{ border-bottom:none; }
  .feed-item .t{ font-size:10.5px; color:var(--muted); margin-top:2px; }

  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    padding:7px 13px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .tag-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ font-size:11px; padding:3px 8px; border-radius:6px; background:var(--surface-2); color:var(--muted); }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  @media (max-width: 860px){
    .shell{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; }
    .kanban{ grid-template-columns:1fr 1fr; }
    .view{ padding:18px 16px 40px; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">BF</div>
      <div class="brand-text">
        <h1>바이오파운드리<br>통합플랫폼</h1>
        <span>PROTOTYPE&nbsp;v0.1</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div>공공의료 ISP · ISMP 수립</div>
      <div class="mono">To-Be 클릭 프로토타입</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb"><span>바이오파운드리 통합플랫폼</span><span>/</span><b id="crumbCurrent">대시보드</b></div>
      <div class="topbar-right">
        <span class="badge proto">● 목업 데이터 · 프로토타입</span>
        <span class="badge">담당자 · 이연구 책임연구원</span>
        <button class="theme-toggle" id="themeToggle" type="button" title="테마 전환">라이트/다크</button>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<script>
/* ---------------- nav model ---------------- */
const NAV = [
  { group:'개요', items:[
    { id:'dashboard', label:'대시보드' },
  ]},
  { group:'연구 운영', items:[
    { id:'eln', label:'실험관리 · ELN' },
    { id:'sop', label:'워크플로 · SOP' },
    { id:'biobank', label:'바이오뱅크' },
    { id:'equipment', label:'장비 · IoT 모니터링' },
  ]},
  { group:'자원 · 지능', items:[
    { id:'inventory', label:'재고 · 자원관리' },
    { id:'ai', label:'AI 분석 파이프라인' },
  ]},
  { group:'협업 · 전달', items:[
    { id:'collab', label:'커뮤니케이션 · 협업' },
    { id:'delivery', label:'결과 제공 · 전달' },
    { id:'knowledge', label:'교육 · 지식관리' },
  ]},
  { group:'플랫폼', items:[
    { id:'ops', label:'시스템 운영' },
  ]},
];
const LABELS = Object.fromEntries(NAV.flatMap(g=>g.items).map(i=>[i.id,i.label]));

function renderNav(active){
  const el = document.getElementById('nav');
  el.innerHTML = NAV.map(g => `
    <div class="nav-group">
      <span class="nav-group-label">${g.group}</span>
      ${g.items.map(it => `
        <button class="nav-item ${it.id===active?'active':''}" data-view="${it.id}">
          <span class="dot"></span>${it.label}
        </button>
      `).join('')}
    </div>
  `).join('');
  el.querySelectorAll('.nav-item').forEach(b=>{
    b.addEventListener('click', ()=> go(b.dataset.view));
  });
}

/* ---------------- small chart helpers ---------------- */
function sparkline(values, {w=120,h=32,color='var(--accent)'}={}){
  const max = Math.max(...values), min = Math.min(...values);
  const span = (max-min) || 1;
  const step = w/(values.length-1);
  const pts = values.map((v,i)=> `${(i*step).toFixed(1)},${(h-((v-min)/span)*h).toFixed(1)}`).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/>
  </svg>`;
}
function bar(pct, cls=''){
  return `<div class="bar-row"><div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div><span class="pct mono">${pct}%</span></div>`;
}
function pill(text, tone='neutral'){ return `<span class="pill ${tone}"><span class="dot"></span>${text}</span>`; }

/* ---------------- mock data (grounded in ISMP 데이터 주제영역 자료) ---------------- */
const DATA = {
  kpis: [
    { label:'가동중 프로젝트', value:'18', delta:'+2 이번 주', tone:'up' },
    { label:'금일 실험 등록(ELN)', value:'134', delta:'+11% 전일 대비', tone:'up' },
    { label:'장비 평균 가동률', value:'81%', delta:'-3%p 전일 대비', tone:'down' },
    { label:'재고 경고 항목', value:'6', delta:'2건 자동발주 완료', tone:'flat' },
  ],
  domains: [
    { name:'실험/ELN', status:'good', desc:'134건 실행 · 지연 0건' },
    { name:'워크플로/SOP', status:'warn', desc:'승인대기 SOP 3건' },
    { name:'바이오 객체(바이오뱅크)', status:'good', desc:'입출고 22건 처리' },
    { name:'장비/스테이션', status:'critical', desc:'시퀀서-02 점검 필요' },
    { name:'자원/재고 운영', status:'warn', desc:'시약 6종 안전재고 이하' },
    { name:'AI 분석', status:'good', desc:'파이프라인 4종 정상' },
    { name:'커뮤니케이션/협업', status:'good', desc:'멘션 12건' },
    { name:'결과제공/전달', status:'info', desc:'고객사 리포트 3건 발송 대기' },
    { name:'교육/지식', status:'good', desc:'신규 SOP 교육 1건' },
    { name:'시스템운영', status:'good', desc:'API p99 212ms' },
  ],
  feed: [
    { who:'김서연', text:'프로젝트 <b>합성 오페론-14</b>의 시퀀싱 결과가 업로드되었습니다.', t:'6분 전' },
    { who:'로봇-리퀴드핸들러A', text:'플레이트 배치 <span class="id-chip">PLT-2409-118</span> 이송 완료.', t:'19분 전' },
    { who:'박도윤', text:'SOP-DNA-EXT-v3.2 개정본 승인 요청.', t:'41분 전' },
    { who:'AI 이상탐지', text:'인큐베이터-03 온도 편차 감지, 자동 알림 발송.', t:'1시간 전' },
  ],
};

const ELN = {
  samples: [
    { id:'BF-24091301', project:'합성 오페론-14', step:'형질전환 → 콜로니 선별', owner:'김서연', status:'진행중', updated:'10분 전' },
    { id:'BF-24091287', project:'효소 변이체 스크리닝', step:'플레이트 리더 판독', owner:'박도윤', status:'QC 검토', updated:'32분 전' },
    { id:'BF-24091254', project:'대사경로 최적화 v2', step:'배양 · OD600 측정', owner:'이하은', status:'대기', updated:'54분 전' },
    { id:'BF-24091198', project:'합성 오페론-14', step:'시퀀싱 결과 분석', owner:'AI 파이프라인', status:'완료', updated:'2시간 전' },
    { id:'BF-24091142', project:'바이오센서 시제품', step:'DNA 추출', owner:'최민준', status:'보류', updated:'3시간 전' },
  ],
  statusTone: { '진행중':'info', 'QC 검토':'warn', '대기':'neutral', '완료':'good', '보류':'critical' },
};

const SOP = {
  list: [
    { code:'SOP-DNA-EXT-v3.2', name:'DNA 추출 표준작업절차', status:'승인대기', owner:'박도윤', revised:'2026-09-10' },
    { code:'SOP-TRANS-v2.0', name:'형질전환 표준작업절차', status:'승인완료', owner:'김서연', revised:'2026-08-22' },
    { code:'SOP-SEQ-QC-v1.4', name:'시퀀싱 QC 절차', status:'승인완료', owner:'이하은', revised:'2026-07-30' },

    <p>SOP·가이드 등 지식베이스 문서와 연구원 교육 이수 현황을 관리합니다.</p>
  </div>
  <div class="grid grid-cards">
    ${KNOWLEDGE.map(k=>`
      <div class="panel">
        <span class="tag" style="margin-bottom:10px;display:inline-block;">${k.tag}</span>
        <h3 style="font-size:13.5px;margin-bottom:6px;">${k.title}</h3>
        <div style="color:var(--muted);font-size:12px;">${k.t}</div>
      </div>
    `).join('')}
  </div>`;
}

function viewOps(){
  return `
  <div class="view-head">
    <h2>시스템 운영</h2>
    <p>폴리글랏 데이터베이스 아키텍처와 플랫폼 이용자 세션 현황을 모니터링합니다.</p>
  </div>
  <div class="grid grid-2">
    <div class="panel">
      <div class="panel-head"><h3>데이터 인프라 상태</h3><span class="sub">폴리글랏 DB 구성</span></div>
      <div class="stack">
        ${OPS.services.map(s=>`
          <div class="row-between">
            <div><b>${s.name}</b><div style="color:var(--muted);font-size:11.5px;">${s.role}</div></div>
            <div style="text-align:right;">
              ${pill(s.status, s.status==='정상'?'good':'warn')}
              <div class="mono" style="font-size:11px;color:var(--muted);margin-top:4px;">${s.latency}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>접속 사용자</h3><span class="sub">${OPS.users.length}명</span></div>
      <div class="stack">
        ${OPS.users.map(u=>`
          <div class="row-between">
            <span style="display:flex;align-items:center;gap:8px;"><span class="avatar">${u.name.slice(0,1)}</span>${u.name} <span style="color:var(--muted);font-size:11.5px;">· ${u.role}</span></span>
            <span style="color:var(--muted);font-size:11.5px;">${u.active}</span>
          </div>
        `).join('')}
      </div>
    </div>
  </div>`;
}

const VIEWS = {
  dashboard:viewDashboard, eln:viewEln, sop:viewSop, biobank:viewBiobank,
  equipment:viewEquipment, inventory:viewInventory, ai:viewAi,
  collab:viewCollab, delivery:viewDelivery, knowledge:viewKnowledge, ops:viewOps,
};

function go(id){
  document.getElementById('view').innerHTML = VIEWS[id]();
  document.getElementById('crumbCurrent').textContent = LABELS[id];
  renderNav(id);
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---------------- theme toggle ---------------- */
(function(){
  const root = document.documentElement;
  const saved = (() => { try { return localStorage.getItem('bf_theme'); } catch(e){ return null; } })();
  if(saved==='light' || saved==='dark') root.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const cur = root.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : (cur==='light' ? null : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
    if(next){ root.setAttribute('data-theme', next); } else { root.removeAttribute('data-theme'); }
    try { localStorage.setItem('bf_theme', next || ''); } catch(e){}
  });
})();

go('dashboard');
</script>
